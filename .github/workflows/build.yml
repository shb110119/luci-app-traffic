name: Build luci-app-traffic (ipk + apk)

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'

env:
  TZ: Asia/Shanghai

jobs:
  # ---------------------------------------------------------------------------
  # ipk：OpenWrt 23.05 及以下（opkg）使用
  # 本包是纯 LuCI 资源包，不含任何需编译的代码，因此不需要 SDK，
  # 直接按 ipk 格式（ar + control.tar.gz + data.tar.gz）打包，秒级完成。
  # ---------------------------------------------------------------------------
  ipk:
    name: ipk (OpenWrt 23.05 / opkg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 打包 ipk
        run: sh .github/scripts/build-ipk.sh

      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: out/*.ipk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # apk：OpenWrt snapshot / 24.10+（apk）使用
  # apk 需要签名才能被默认信任，必须用官方 SDK 生成，故保留 SDK 流程。
  # ---------------------------------------------------------------------------
  apk:
    name: apk (snapshot / apk-tools)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 定位并下载 OpenWrt snapshot SDK
        run: |
          BASE="https://downloads.openwrt.org/snapshots/targets/x86/64/"
          FILE=$(curl -sL "$BASE" | grep -oE 'openwrt-sdk-[^"]*\.(tar\.xz|tar\.zst)' | sort -u | tail -1)
          [ -n "$FILE" ] || { echo "未找到 SDK 文件"; exit 1; }
          echo "SDK 文件: $FILE"
          curl -sL -o sdk.tar "$BASE$FILE"
          case "$FILE" in
            *.zst) tar --zstd -xf sdk.tar ;;
            *)     tar -xJf sdk.tar ;;
          esac
          mv openwrt-sdk-* sdk

      - name: 放入包源码
        run: |
          mkdir -p sdk/package/luci-app-traffic
          for item in Makefile LICENSE htdocs root; do
            cp -a "$item" sdk/package/luci-app-traffic/
          done
          ls -la sdk/package/luci-app-traffic/

      - name: 更新并安装 feeds
        working-directory: sdk
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 编译 luci-app-traffic
        working-directory: sdk
        run: |
          echo "CONFIG_PACKAGE_luci-app-traffic=m" >> .config
          make defconfig
          make package/luci-app-traffic/compile V=s -j"$(nproc)" \
            || make package/luci-app-traffic/compile V=s -j1

      - name: 收集产物
        run: |
          mkdir -p out
          find sdk/bin/packages -type f -name 'luci-app-traffic*.apk' -exec cp {} out/ \;
          ls -la out/
          [ -n "$(ls out/)" ] || { echo "没有产出 apk 文件"; exit 1; }

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: out/*.apk
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 发布：仅在手动触发（workflow_dispatch）时创建/更新 Release
  # ---------------------------------------------------------------------------
  release:
    needs: [ipk, apk]
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true
          path: out

      - name: 发布 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VER=$(sed -n 's/^PKG_VERSION:=//p' Makefile | head -1)
          TAG="v${VER:-1.0.0}"
          ls -la out/
          NOTES=$(printf '%s\n' \
            '均为 **all 架构**，与 CPU 无关（x86 / ARM / MIPS 通用）。' \
            '' \
            '- `.ipk` → OpenWrt 23.05 及以下（opkg 包管理）' \
            '- `.apk` → OpenWrt snapshot / 24.10+（apk 包管理）' \
            '' \
            '安装后进入 LuCI「状态 → 网络流量」。依赖：luci-base、vnstat2。')
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" \
              --title "luci-app-traffic $TAG" \
              --notes "$NOTES"
          gh release upload "$TAG" out/* --repo "$GITHUB_REPOSITORY" --clobber
